<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><rect width="1400" height="620" fill="white"/><text x="700" y="52" text-anchor="middle" font-size="32" fill="#24334b">같은 입력, 서로 다른 제거 순서</text><text x="170" y="151" text-anchor="middle" font-size="21" fill="#24334b">10 → 20 → 30 추가</text><rect x="330" y="115" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="385" y="152" text-anchor="middle" font-size="24" fill="#24334b">10</text><rect x="455" y="115" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="510" y="152" text-anchor="middle" font-size="24" fill="#24334b">20</text><rect x="580" y="115" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="635" y="152" text-anchor="middle" font-size="24" fill="#24334b">30</text><text x="170" y="301" text-anchor="middle" font-size="21" fill="#24334b">스택에서 30 제거</text><rect x="330" y="265" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="385" y="302" text-anchor="middle" font-size="24" fill="#24334b">10</text><rect x="455" y="265" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="510" y="302" text-anchor="middle" font-size="24" fill="#24334b">20</text><rect x="580" y="265" width="110" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="635" y="302" text-anchor="middle" font-size="24" fill="#24334b">빈칸</text><text x="1080" y="301" text-anchor="middle" font-size="24" fill="#24334b">LIFO / 후입선출</text><text x="170" y="451" text-anchor="middle" font-size="21" fill="#24334b">큐에서 10 제거</text><rect x="330" y="415" width="110" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="385" y="452" text-anchor="middle" font-size="24" fill="#24334b">빈칸</text><rect x="455" y="415" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="510" y="452" text-anchor="middle" font-size="24" fill="#24334b">20</text><rect x="580" y="415" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="635" y="452" text-anchor="middle" font-size="24" fill="#24334b">30</text><text x="1080" y="451" text-anchor="middle" font-size="24" fill="#24334b">FIFO / 선입선출</text><text x="700" y="560" text-anchor="middle" font-size="23" fill="#24334b">스택은 마지막에 넣은 값, 큐는 먼저 넣은 값을 꺼낸다</text></svg>
