<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><rect width="1400" height="620" fill="white"/><text x="700" y="52" text-anchor="middle" font-size="32" fill="#24334b">벡터: 용량이 부족할 때의 재할당</text><text x="170" y="156" text-anchor="middle" font-size="21" fill="#24334b">기존 공간</text><rect x="330" y="120" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="385" y="157" text-anchor="middle" font-size="24" fill="#24334b">10</text><rect x="455" y="120" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="510" y="157" text-anchor="middle" font-size="24" fill="#24334b">20</text><rect x="580" y="120" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="635" y="157" text-anchor="middle" font-size="24" fill="#24334b">30</text><rect x="705" y="120" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="760" y="157" text-anchor="middle" font-size="24" fill="#24334b">40</text><text x="700" y="235" text-anchor="middle" font-size="24" fill="#24334b">더 큰 연속 공간 확보 → 기존 원소 이동 또는 복사</text><text x="170" y="346" text-anchor="middle" font-size="21" fill="#24334b">새 공간</text><rect x="330" y="310" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="385" y="347" text-anchor="middle" font-size="24" fill="#24334b">10</text><rect x="455" y="310" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="510" y="347" text-anchor="middle" font-size="24" fill="#24334b">20</text><rect x="580" y="310" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="635" y="347" text-anchor="middle" font-size="24" fill="#24334b">30</text><rect x="705" y="310" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="760" y="347" text-anchor="middle" font-size="24" fill="#24334b">40</text><rect x="830" y="310" width="110" height="58" rx="8" fill="#ffdfaa" stroke="#64748b"/><text x="885" y="347" text-anchor="middle" font-size="24" fill="#24334b">50</text><rect x="955" y="310" width="110" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="1010" y="347" text-anchor="middle" font-size="24" fill="#24334b">빈칸</text><rect x="1080" y="310" width="110" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="1135" y="347" text-anchor="middle" font-size="24" fill="#24334b">빈칸</text><rect x="1205" y="310" width="110" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="1260" y="347" text-anchor="middle" font-size="24" fill="#24334b">빈칸</text><text x="700" y="445" text-anchor="middle" font-size="26" fill="#24334b">크기 4 → 5 / 용량 4 → 8</text><text x="700" y="510" text-anchor="middle" font-size="22" fill="#24334b">용량 8은 예시이며 실제 증가 배율은 구현에 따라 다르다</text></svg>
