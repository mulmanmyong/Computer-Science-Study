<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><rect width="1400" height="620" fill="white"/><text x="700" y="52" text-anchor="middle" font-size="32" fill="#24334b">원형 큐: 배열의 앞쪽 빈 공간 재사용</text><text x="170" y="156" text-anchor="middle" font-size="21" fill="#24334b">40 추가 직후</text><rect x="330" y="120" width="110" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="385" y="157" text-anchor="middle" font-size="24" fill="#24334b">빈칸</text><rect x="455" y="120" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="510" y="157" text-anchor="middle" font-size="24" fill="#24334b">20</text><rect x="580" y="120" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="635" y="157" text-anchor="middle" font-size="24" fill="#24334b">30</text><rect x="705" y="120" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="760" y="157" text-anchor="middle" font-size="24" fill="#24334b">40</text><text x="700" y="235" text-anchor="middle" font-size="24" fill="#24334b">front = 1 / rear = 0 / count = 3</text><text x="170" y="346" text-anchor="middle" font-size="21" fill="#24334b">50 추가 직후</text><rect x="330" y="310" width="110" height="58" rx="8" fill="#ffdfaa" stroke="#64748b"/><text x="385" y="347" text-anchor="middle" font-size="24" fill="#24334b">50</text><rect x="455" y="310" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="510" y="347" text-anchor="middle" font-size="24" fill="#24334b">20</text><rect x="580" y="310" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="635" y="347" text-anchor="middle" font-size="24" fill="#24334b">30</text><rect x="705" y="310" width="110" height="58" rx="8" fill="#eaf1ff" stroke="#64748b"/><text x="760" y="347" text-anchor="middle" font-size="24" fill="#24334b">40</text><text x="700" y="425" text-anchor="middle" font-size="24" fill="#24334b">front = 1 / rear = 1 / count = 4</text><text x="700" y="495" text-anchor="middle" font-size="27" fill="#24334b">꺼내는 순서: 20 → 30 → 40 → 50</text><text x="700" y="555" text-anchor="middle" font-size="21" fill="#24334b">rear는 다음 삽입 위치이며, 빈 상태와 가득 찬 상태는 count로 구분</text></svg>
