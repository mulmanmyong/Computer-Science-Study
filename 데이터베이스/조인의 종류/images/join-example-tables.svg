<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="1480" height="760" fill="#ffffff"/>
  <style>
    text { fill: #25324a; }
    .title { font-size: 42px; font-weight: 700; }
    .table-title { font-size: 28px; font-weight: 700; }
    .header { font-size: 22px; font-weight: 700; }
    .body { font-size: 22px; font-weight: 500; }
    .note { font-size: 22px; font-weight: 700; fill: #b86f18; }
  </style>

  <text x="740" y="66" text-anchor="middle" class="title">조인 예제의 공통 입력 테이블</text>

  <text x="390" y="130" text-anchor="middle" class="table-title">employee</text>
  <rect x="70" y="160" width="640" height="360" rx="18" fill="#ffffff" stroke="#66758d" stroke-width="4"/>
  <rect x="70" y="160" width="640" height="90" rx="18" fill="#e8f0ff"/>
  <rect x="470" y="160" width="240" height="360" rx="18" fill="#fff3df"/>
  <rect x="470" y="160" width="240" height="90" rx="18" fill="#f6dcae"/>
  <line x1="250" y1="160" x2="250" y2="520" stroke="#66758d" stroke-width="3"/>
  <line x1="470" y1="160" x2="470" y2="520" stroke="#66758d" stroke-width="3"/>
  <line x1="70" y1="250" x2="710" y2="250" stroke="#66758d" stroke-width="3"/>
  <line x1="70" y1="340" x2="710" y2="340" stroke="#66758d" stroke-width="2"/>
  <line x1="70" y1="430" x2="710" y2="430" stroke="#66758d" stroke-width="2"/>
  <text x="160" y="216" text-anchor="middle" class="header">employee_id</text>
  <text x="360" y="216" text-anchor="middle" class="header">employee_name</text>
  <text x="590" y="216" text-anchor="middle" class="header">department_id</text>
  <text x="160" y="306" text-anchor="middle" class="body">1</text>
  <text x="360" y="306" text-anchor="middle" class="body">홍길동</text>
  <text x="590" y="306" text-anchor="middle" class="body">10</text>
  <text x="160" y="396" text-anchor="middle" class="body">2</text>
  <text x="360" y="396" text-anchor="middle" class="body">김철수</text>
  <text x="590" y="396" text-anchor="middle" class="body">20</text>
  <text x="160" y="486" text-anchor="middle" class="body">3</text>
  <text x="360" y="486" text-anchor="middle" class="body">이영희</text>
  <text x="590" y="486" text-anchor="middle" class="body">NULL</text>

  <text x="1090" y="130" text-anchor="middle" class="table-title">department</text>
  <rect x="790" y="160" width="620" height="360" rx="18" fill="#ffffff" stroke="#66758d" stroke-width="4"/>
  <rect x="790" y="160" width="620" height="90" rx="18" fill="#e8f0ff"/>
  <rect x="790" y="160" width="260" height="360" rx="18" fill="#fff3df"/>
  <rect x="790" y="160" width="260" height="90" rx="18" fill="#f6dcae"/>
  <line x1="1050" y1="160" x2="1050" y2="520" stroke="#66758d" stroke-width="3"/>
  <line x1="790" y1="250" x2="1410" y2="250" stroke="#66758d" stroke-width="3"/>
  <line x1="790" y1="340" x2="1410" y2="340" stroke="#66758d" stroke-width="2"/>
  <line x1="790" y1="430" x2="1410" y2="430" stroke="#66758d" stroke-width="2"/>
  <text x="920" y="216" text-anchor="middle" class="header">department_id</text>
  <text x="1230" y="216" text-anchor="middle" class="header">department_name</text>
  <text x="920" y="306" text-anchor="middle" class="body">10</text>
  <text x="1230" y="306" text-anchor="middle" class="body">개발팀</text>
  <text x="920" y="396" text-anchor="middle" class="body">20</text>
  <text x="1230" y="396" text-anchor="middle" class="body">디자인팀</text>
  <text x="920" y="486" text-anchor="middle" class="body">30</text>
  <text x="1230" y="486" text-anchor="middle" class="body">인사팀</text>

  <rect x="420" y="590" width="640" height="100" rx="20" fill="#fff7e8" stroke="#c9842c" stroke-width="3"/>
  <text x="740" y="635" text-anchor="middle" class="note">조인 조건</text>
  <text x="740" y="672" text-anchor="middle" class="body">employee.department_id = department.department_id</text>
</svg>
